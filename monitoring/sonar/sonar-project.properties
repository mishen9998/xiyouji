# ========================================
# SonarQube 项目配置
# ========================================

# 项目唯一标识
sonar.projectKey=xiyouji-roguelike

# 项目名称
sonar.projectName=西游记Roguelike卡牌游戏

# 项目版本
sonar.projectVersion=1.0.0

# 源代码目录
sonar.sources=xiyouji-common/src/main/java,xiyouji-domain/src/main/java,xiyouji-application/src/main/java,xiyouji-infrastructure/src/main/java,xiyouji-bootstrap/src/main/java

# 测试代码目录
sonar.tests=xiyouji-bootstrap/src/test/java

# Java 类文件目录（用于覆盖率计算）
sonar.java.binaries=xiyouji-common/target/classes,xiyouji-domain/target/classes,xiyouji-application/target/classes,xiyouji-infrastructure/target/classes,xiyouji-bootstrap/target/classes

# JaCoCo 覆盖率报告路径
sonar.coverage.jacoco.xmlReportPaths=xiyouji-bootstrap/target/site/jacoco-aggregate/jacoco.xml

# 排除目录
sonar.exclusions=**/static/**,**/resources/**,**/target/**

# 编码
sonar.sourceEncoding=UTF-8

# Java 版本
sonar.java.source=17
