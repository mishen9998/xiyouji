# ========================================
# 西游记 Roguelike - 分布式 Docker 编排
# 
# 启动全部服务:  docker-compose up -d --build
# 查看状态:      docker-compose ps
# 查看日志:      docker-compose logs -f
# 停止:          docker-compose down
# 重新构建:      docker-compose up -d --build
# ========================================
services:
  # ====== MySQL 数据库 ======
  mysql:
    image: mysql:8.0
    container_name: xiyouji-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: xiyouji
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xiyouji-net

  # ====== Redis 缓存 & 会话存储 ======
  redis:
    image: redis:7-alpine
    container_name: xiyouji-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - xiyouji-net

  # ====== Spring Boot 实例 1 ======
  app-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xiyouji-app-1
    environment:
      - SPRING_PROFILES_ACTIVE=instance1,distributed
      # Spring Boot 标准环境变量自动覆盖配置文件
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/xiyouji?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - INSTANCE_ID=instance-1-docker
      - ENFORCE_JWT=true
      - JWT_SECRET=xiyouji-production-secret-key-change-me-in-real-deployment-256bits
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://127.0.0.1
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - xiyouji-net

  # ====== Spring Boot 实例 2 ======
  app-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xiyouji-app-2
    environment:
      - SPRING_PROFILES_ACTIVE=instance2,distributed
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/xiyouji?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - INSTANCE_ID=instance-2-docker
      - ENFORCE_JWT=true
      - JWT_SECRET=xiyouji-production-secret-key-change-me-in-real-deployment-256bits
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://127.0.0.1
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - xiyouji-net

  # ====== Nginx 负载均衡器 ======
  nginx:
    image: nginx:alpine
    container_name: xiyouji-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - xiyouji-net

  # ====== Prometheus 监控 ======
  prometheus:
    image: prom/prometheus:latest
    container_name: xiyouji-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - xiyouji-net

  # ====== Zipkin 分布式链路追踪 ======
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: xiyouji-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem  # 学习用内存存储；生产环境应改用 mysql/elasticsearch
    networks:
      - xiyouji-net

  # ====== Grafana 可视化面板 ======
  grafana:
    image: grafana/grafana:latest
    container_name: xiyouji-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - xiyouji-net

# ====== 数据卷 ======
volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

# ====== 网络 ======
networks:
  xiyouji-net:
    driver: bridge
