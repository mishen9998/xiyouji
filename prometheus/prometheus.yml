# ========================================
# Prometheus 监控配置
# 抓取多个 Spring Boot 实例的指标
# ========================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 实例1
  - job_name: 'xiyouji-instance-1'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8081']
        labels:
          instance: 'instance-1'
          env: 'distributed'

  # 实例2
  - job_name: 'xiyouji-instance-2'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8082']
        labels:
          instance: 'instance-2'
          env: 'distributed'

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
