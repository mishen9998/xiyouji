# ========================================
# 西游记Roguelike卡牌游戏 - 生产环境配置
# 安全原则：敏感配置不提供默认值，强制通过环境变量注入
# ========================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/xiyouji?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # 生产环境必须通过 DB_PASSWORD 环境变量注入，不提供默认值
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
server:
  port: 8080
logging:
  level:
    com.xiyouji: INFO
  file:
    name: logs/xiyouji.log
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: xiyouji-roguelike
    distribution:
      percentiles-histogram:
        http.server.requests: true
jwt:
  # 生产环境必须通过 JWT_SECRET 环境变量注入（至少 256 位）；
  # 若缺失，JwtUtil.validateSecret() 会在 enforceJwt=true 时拒绝启动
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
app:
  redis:
    session-enabled: ${APP_REDIS_SESSION_ENABLED:true}
  security:
    enforce-jwt: ${ENFORCE_JWT:true}
  cors:
    # 生产环境必须通过 CORS_ORIGINS 显式配置允许的前端域名，不包含 localhost
    allowed-origins: ${CORS_ORIGINS}
