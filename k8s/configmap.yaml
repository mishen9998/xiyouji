apiVersion: v1
kind: ConfigMap
metadata:
  name: xiyouji-config
data:
  SPRING_PROFILES_ACTIVE: distributed
  SERVER_PORT: "8080"
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.default.svc.cluster.local:3306/xiyouji?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  SPRING_DATA_REDIS_HOST: redis.default.svc.cluster.local
  SPRING_DATA_REDIS_PORT: "6379"
  ENFORCE_JWT: "true"
  CORS_ORIGINS: https://example.com
