# Isolated, local-only T6 integration stack. No production .env or external data.
# Build the current jar with .\mvnw.cmd -B verify before starting the apps.
# docker compose -p xiyouji-t6-20260917 -f docker-compose.t6.yml up -d
x-app: &app
  image: eclipse-temurin:17.0.13_11-jre-alpine
  command: ["java", "-Xms128m", "-Xmx512m", "-jar", "/app/app.jar"]
  volumes:
    - ./xiyouji-bootstrap/target/${XIYOUJI_JAR:-xiyouji-bootstrap-1.2.1.jar}:/app/app.jar:ro
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &environment
    SPRING_PROFILES_ACTIVE: distributed
    SERVER_PORT: 8080
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xiyouji_t6?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    SPRING_DATASOURCE_USERNAME: root
    DB_PASSWORD: t6-local-disposable-only
    SPRING_DATASOURCE_PASSWORD: t6-local-disposable-only
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    JWT_SECRET: t6-local-only-integration-secret-not-a-production-key-20260917
    ENFORCE_JWT: "true"
    CORS_ORIGINS: http://127.0.0.1:4176,http://localhost:4176,http://127.0.0.1:5176,http://127.0.0.1:18086,http://127.0.0.1:18087
    MANAGEMENT_TRACING_ENABLED: "false"
    APP_ROOM_CLEANUP_ENABLED: "false"
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 90s
  mem_limit: 768m

services:
  mysql:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: t6-local-disposable-only
      MYSQL_DATABASE: xiyouji_t6
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [t6_mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 24
  redis:
    image: redis:7.2.5-alpine3.19
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [t6_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  app-1:
    <<: *app
    ports: ["127.0.0.1:18086:8080"]
    environment:
      <<: *environment
      INSTANCE_ID: t6-instance-1
  app-2:
    <<: *app
    ports: ["127.0.0.1:18087:8080"]
    environment:
      <<: *environment
      INSTANCE_ID: t6-instance-2

volumes:
  t6_mysql:
  t6_redis:
