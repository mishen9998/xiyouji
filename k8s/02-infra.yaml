# 基础依赖：MySQL + Redis（本地 kind 验证配置）
# 验证环境使用 emptyDir 卷，重启丢数据；生产应使用 StatefulSet + PVC / 云托管实例。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: xiyouji
  labels: { app: mysql }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.39
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: xiyouji-secrets, key: DB_PASSWORD }
            - name: MYSQL_DATABASE
              value: xiyouji
          ports:
            - { containerPort: 3306 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            limits: { cpu: "1", memory: 768Mi }
            requests: { cpu: 250m, memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: xiyouji
spec:
  selector: { app: mysql }
  ports:
    - { port: 3306, targetPort: 3306 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: xiyouji
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.2.5-alpine3.19
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
          ports:
            - { containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits: { cpu: 500m, memory: 384Mi }
            requests: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: xiyouji
spec:
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379 }