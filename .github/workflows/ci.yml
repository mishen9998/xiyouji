# ========================================
# 西游记Roguelike卡牌游戏 - GitHub Actions CI
# 触发: push到main/develop, pull request到main
# ========================================
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # ========================================
  # 测试任务
  # ========================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 运行测试 + JaCoCo覆盖率
        working-directory: backend
        run: mvn -B test

      - name: SonarQube 静态分析
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B sonar:sonar -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # ========================================
  # 构建任务 (依赖测试任务)
  # ========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 构建打包 (跳过测试)
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xiyouji-roguelike-jar
          path: backend/target/*.jar
          retention-days: 7
