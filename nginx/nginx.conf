# ========================================
# Nginx 负载均衡配置
# 将请求分发到多个 Spring Boot 实例
# 
# 安装 Nginx for Windows:
#   1. 下载 http://nginx.org/en/download.html
#   2. 解压到 C:\nginx
#   3. 将此文件复制到 C:\nginx\conf\nginx.conf
#   4. 启动: cd C:\nginx && start nginx
#   5. 重载: nginx -s reload
#   6. 停止: nginx -s stop
# ========================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # 日志格式 - 包含上游实例标识
    log_format upstream_log '[$time_local] $remote_addr -> $upstream_addr '
                          '"$request" $status $body_bytes_sent '
                          'rt=$request_time uct="$upstream_connect_time"';
    
    access_log  /var/log/nginx/access.log  upstream_log;
    
    sendfile        on;
    keepalive_timeout  65;
    
    # ====== 限流区域定义（必须在 server 块之前）======
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # WebSocket Origin 白名单。生产环境通过挂载配置替换为正式域名。
    map $http_origin $ws_origin_blocked {
        default 1;
        "" 0;
        ~^https?://(localhost|127\.0\.0\.1)(:\d+)?$ 0;
    }

    # Upgrade 请求头需要显式转换，否则普通 HTTP 请求会被错误升级。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ====== 上游服务器池 - 负载均衡核心 ======
    upstream xiyouji_backend {
        # Redis 状态和 Pub/Sub 已保证跨实例一致性，不再依赖 ip_hash。
        server app-1:8081 weight=1 max_fails=3 fail_timeout=30s;
        server app-2:8082 weight=1 max_fails=3 fail_timeout=30s;
        # 可继续添加更多实例:
        # server app-3:8083 weight=1 max_fails=3 fail_timeout=30s;
    }
    
    server {
        listen 80;
        server_name localhost;
        
        # ====== 前端静态资源 ======
        location / {
            proxy_pass http://xiyouji_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ====== API 请求 - 负载均衡到后端实例 ======
        # 实例信息是只读的监控/路由探针，不占用游戏 API 的用户限流配额。
        # 这样压测和 Prometheus 探针不会因为共享一个出口 IP 而互相干扰。
        location ^~ /api/instance/ {
            proxy_pass http://xiyouji_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
        }

        location /api/ {
            proxy_pass http://xiyouji_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 限流: 每IP每秒最多10个请求
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            
            # 超时设置
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
        }

        # ====== WebSocket / SockJS 长连接 ======
        location /ws {
            # 带 Origin 的浏览器请求必须命中白名单；无 Origin 的健康探测允许通过。
            if ($ws_origin_blocked) { return 403; }
            proxy_pass http://xiyouji_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
        
        # ====== Actuator 监控端点 ======
        location /actuator/ {
            proxy_pass http://xiyouji_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # ====== 健康检查端点 ======
        location /health {
            proxy_pass http://xiyouji_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }
    }
    
}
