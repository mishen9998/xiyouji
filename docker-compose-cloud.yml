# ========================================
# 西游记 - 单实例精简部署版
# 本地快速演示：直接构建；VPS：拉取 CI 预构建镜像。
# 只保留 MySQL + Redis + 单实例 App，不承诺高可用或零停机。
# ========================================
services:
  # ====== MySQL 数据库 ======
  mysql:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.cloud}
      MYSQL_DATABASE: xiyouji
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - xiyouji-net

  # ====== Redis 缓存 & 会话存储 ======
  redis:
    image: redis:7.2.5-alpine3.19
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - xiyouji-net

  # ====== Spring Boot 应用实例 ======
  app:
    image: ${APP_IMAGE:-xiyouji:demo}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - INSTANCE_ID=cloud-app
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/xiyouji?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env.cloud}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - ENFORCE_JWT=true
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env.cloud}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be set in .env.cloud}
      # The compact stack has no Zipkin container; avoid noisy failed-export warnings.
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0.0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    ports:
      # VPS 默认只允许宿主机反向代理访问；本地 Demo 可在 .env.demo 中改为 0.0.0.0。
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - xiyouji-net

# ====== 数据卷 ======
volumes:
  mysql_data:
  redis_data:

# ====== 网络 ======
networks:
  xiyouji-net:
    driver: bridge
