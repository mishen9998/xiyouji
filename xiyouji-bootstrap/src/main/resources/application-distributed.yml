# ========================================
# 分布式集群 Profile - 多实例共享配置
# 所有实例共用此基础配置，instance1/instance2 覆盖端口
# ========================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/xiyouji?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    # Distributed mode must receive credentials from the environment/secret.
    password: ${DB_PASSWORD}
    # HikariCP 连接池调优
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1200000}
      pool-name: XiYouJiHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    baseline-on-migrate: true

# JWT配置
jwt:
  # Distributed mode must receive the JWT signing key from the environment/secret.
  secret: ${JWT_SECRET}
  expiration: 86400000

# Redis会话存储 - 分布式模式下必须启用
app:
  redis:
    session-enabled: true

# 日志 - 含实例ID便于追踪
logging:
  level:
    com.xiyouji: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] [${INSTANCE_ID:default}] %-5level %logger{36} - %msg%n"

# Actuator 监控 - 暴露给 Prometheus + Zipkin 链路追踪
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,bindings
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  metrics:
    tags:
      application: xiyouji-roguelike
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # 分布式链路追踪 - 默认 10% 采样，压测/排障可通过环境变量临时调高。
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
