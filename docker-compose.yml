# 西游记 Roguelike：双实例多模块 Spring Boot + MySQL + Redis + Nginx
# 启动：docker compose up -d --build
# 查看：docker compose ps / docker compose logs -f app-1 app-2
# 停止：docker compose down

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-common: &app-common
  image: xiyouji:1.0.0
  build: *app-build
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &app-environment
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xiyouji?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
    SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (copy .env.example to .env)}
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    ENFORCE_JWT: ${ENFORCE_JWT:-true}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (copy .env.example to .env)}
    # Keep the Vite development origin aligned with Spring WebSocket and the
    # Nginx Origin allow-list. Override this in .env for real hostnames.
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost,http://localhost:5173,http://127.0.0.1:5173}
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVER_PORT}/actuator/health || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    # Two JVMs start concurrently on small machines; measured cold starts can
    # exceed two minutes while both initialize JPA, Redis and Flyway.
    start_period: 180s
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 768M
      reservations:
        cpus: "0.25"
        memory: 256M
  networks: [xiyouji-net]

services:
  mysql:
    image: mysql:8.0.39
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (copy .env.example to .env)}
      MYSQL_DATABASE: xiyouji
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks: [xiyouji-net]

  redis:
    image: redis:7.2.5-alpine3.19
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    networks: [xiyouji-net]

  app-1:
    <<: *app-common
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: instance1,distributed
      SERVER_PORT: 8081
      INSTANCE_ID: instance-1

  app-2:
    <<: *app-common
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: instance2,distributed
      SERVER_PORT: 8082
      INSTANCE_ID: instance-2

  nginx:
    image: nginx:1.27.1-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [xiyouji-net]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    networks: [xiyouji-net]

  zipkin:
    image: openzipkin/zipkin:3.4.2
    restart: unless-stopped
    environment:
      STORAGE_TYPE: mem
    networks: [xiyouji-net]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set (copy .env.example to .env)}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [xiyouji-net]

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  xiyouji-net:
    driver: bridge
