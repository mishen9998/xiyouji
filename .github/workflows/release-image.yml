name: Release container image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for the exact release commit
        uses: actions/github-script@v7
        with:
          script: |
            // Pushing a tag and its commit together leaves CI still running;
            // the gate must wait for it instead of failing on the first lookup.
            const POLL_INTERVAL_MS = 60000;
            const WAIT_BUDGET_MS = 90 * 60 * 1000;
            const findResult = async () => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                per_page: 100
              });
              return {
                passed: runs.find(run => run.status === 'completed' && run.conclusion === 'success'),
                finished: runs.filter(run => run.status === 'completed')
              };
            };
            let result = await findResult();
            if (result.passed) {
              core.info(`Release verified by ${result.passed.html_url}`);
              return;
            }
            if (result.finished.length > 0) {
              core.setFailed(`CI for ${context.sha} completed without success (${result.finished.map(run => run.conclusion).join(',')}).`);
              return;
            }
            const deadline = Date.now() + WAIT_BUDGET_MS;
            while (Date.now() < deadline) {
              core.info(`CI on ${context.sha} is queued or running; checking again in 60s.`);
              await new Promise(resolve => setTimeout(resolve, POLL_INTERVAL_MS));
              result = await findResult();
              if (result.passed) {
                core.info(`Release verified by ${result.passed.html_url}`);
                return;
              }
              if (result.finished.length > 0) {
                core.setFailed(`CI for ${context.sha} completed without success (${result.finished.map(run => run.conclusion).join(',')}).`);
                return;
              }
            }
            core.setFailed(`Timed out after 90 minutes waiting for CI on ${context.sha}.`);

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
