name: CI

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Frontend, Maven and container verification
    runs-on: ubuntu-latest
    env:
      # Ephemeral CI-only credentials; production values come from a secret manager.
      DB_PASSWORD: ci-db-password-not-for-production
      JWT_SECRET: ci-jwt-secret-at-least-32-bytes-not-for-production
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend-vue

      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend-vue

      - name: Frontend production build
        run: npm run build --prefix frontend-vue

      - name: Maven verification and coverage
        run: bash mvnw -B -pl xiyouji-bootstrap -am verify

      - name: Validate Compose file
        run: docker compose config

      - name: Validate Kubernetes manifests (offline schema check)
        run: >-
          docker run --rm
          -v "$PWD/k8s:/work:ro"
          ghcr.io/yannh/kubeconform:v0.6.7
          -strict -summary /work

      - name: Build multi-stage image
        run: docker build --tag xiyouji:${{ github.sha }} .

      - name: Start distributed Compose E2E stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait

      - name: Validate Prometheus alert rules
        run: docker compose exec -T prometheus promtool check rules /etc/prometheus/alert_rules.yml

      - name: Run distributed REST and WebSocket E2E
        run: >-
          bash mvnw -B -pl xiyouji-bootstrap -am -Pcompose-e2e
          -Dtest=DistributedComposeE2ETest
          -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test

      - name: Tear down distributed E2E stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

      - name: SonarQube analysis (optional)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            bash mvnw -B sonar:sonar -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.login="$SONAR_TOKEN"
          else
            echo "SonarQube secrets not configured; skipping analysis."
          fi
