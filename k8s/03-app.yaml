# 西游记 Roguelike 应用：双副本 Deployment + NodePort 服务（本地 kind 验证配置）
# 多实例共享 Redis 权威状态，倒计时/换装由按房间粒度的 Redisson 分布式锁串行；动态扩缩容安全。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiyouji-app
  namespace: xiyouji
  labels: { app: xiyouji-app }
spec:
  replicas: 2
  # 旧副本在新副本 Ready 且退出后才下线，保证 WebSocket 会话可被并排重新建立
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: xiyouji-app }
  template:
    metadata:
      labels: { app: xiyouji-app }
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: xiyouji:1.2.0-k8s
          # Always：本地验证迭代频繁，同一 tag 会被反复覆盖，避免节点复用旧层
          imagePullPolicy: Always
          ports:
            - { containerPort: 8080 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: distributed }
            - name: INSTANCE_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://mysql:3306/xiyouji?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true" }
            - { name: SPRING_DATASOURCE_USERNAME, value: root }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: xiyouji-secrets, key: DB_PASSWORD }
            - { name: SPRING_DATA_REDIS_HOST, value: redis }
            - { name: SPRING_DATA_REDIS_PORT, value: "6379" }
            - { name: ENFORCE_JWT, value: "true" }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: xiyouji-secrets, key: JWT_SECRET }
            - { name: CORS_ORIGINS, value: "http://localhost:30080,http://localhost:8080,http://localhost,http://127.0.0.1:5173" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
          resources:
            limits: { cpu: "1", memory: 768Mi }
            requests: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: xiyouji-app
  namespace: xiyouji
spec:
  type: NodePort
  selector: { app: xiyouji-app }
  ports:
    - { port: 8080, targetPort: 8080, nodePort: 30080 }