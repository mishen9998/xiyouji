# 验证环境 Secret（仅用于本地 kind 集群演示）
# 生产环境应由外部密钥管理系统（Sealed Secrets / Vault / 云 KMS）注入，
# 切勿将生产凭据写入仓库。
apiVersion: v1
kind: Secret
metadata:
  name: xiyouji-secrets
  namespace: xiyouji
type: Opaque
stringData:
  DB_PASSWORD: "xiyouji-demo-db-password"
  # JWT 签名密钥：生产必须替换为高强度随机值（>=32 字节）
  JWT_SECRET: "xiyouji-demo-jwt-secret-please-rotate-in-prod-0123456789abcdef"