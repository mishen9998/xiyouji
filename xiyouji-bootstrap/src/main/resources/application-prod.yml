# ========================================
# 西游记Roguelike卡牌游戏 - 生产环境配置
# ========================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/xiyouji?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # Production credentials are mandatory and must be injected by a secret manager.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
server:
  port: 8080
logging:
  level:
    com.xiyouji: INFO
  file:
    name: logs/xiyouji.log
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: xiyouji-roguelike
    distribution:
      percentiles-histogram:
        http.server.requests: true
jwt:
  # Production credentials are mandatory and must be injected by a secret manager.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
app:
  redis:
    session-enabled: ${APP_REDIS_SESSION_ENABLED:true}
  security:
    enforce-jwt: ${ENFORCE_JWT:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost,http://localhost:8080}
