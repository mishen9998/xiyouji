<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西游记卡牌宝物总览</title>
<style>
:root {
  --bg-dark: #1a1a2e;
  --bg-panel: #16213e;
  --bg-card: #0f3460;
  --text-primary: #e8e8e8;
  --text-muted: #8899aa;
  --gold: #f2a900;
  --green: #4caf50;
  --blue: #4fc3f7;
  --purple: #ab47bc;
  --red: #ef5350;
  --legendary: #ff6f00;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-dark);
  color: var(--text-primary);
  font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
  padding: 20px;
}
h1 { color: var(--gold); text-align: center; margin-bottom: 8px; font-size: 28px; letter-spacing: 4px; }
.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
.stats-bar {
  display: flex; justify-content: center; gap: 32px; margin-bottom: 24px; flex-wrap: wrap;
}
.stat-item { text-align: center; }
.stat-num { font-size: 32px; font-weight: bold; color: var(--gold); }
.stat-label { font-size: 13px; color: var(--text-muted); }
.tab-bar { display: flex; justify-content: center; gap: 4px; margin-bottom: 20px; }
.tab-btn {
  padding: 10px 32px; border: none; border-radius: 8px 8px 0 0;
  background: var(--bg-panel); color: var(--text-muted);
  cursor: pointer; font-size: 16px; font-family: inherit;
  transition: all 0.2s;
}
.tab-btn.active { background: var(--bg-card); color: var(--gold); border-top: 3px solid var(--gold); }
.filter-bar {
  display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
}
.filter-btn {
  padding: 6px 18px; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
  background: transparent; color: var(--text-muted); cursor: pointer;
  font-size: 13px; font-family: inherit; transition: all 0.2s;
}
.filter-btn.active { background: var(--gold); color: #1a1a2e; border-color: var(--gold); font-weight: bold; }
.filter-btn:hover:not(.active) { border-color: var(--gold); color: var(--gold); }
.search-box {
  display: block; margin: 0 auto 16px; padding: 8px 16px; width: 100%; max-width: 400px;
  background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
  color: var(--text-primary); font-size: 14px; font-family: inherit;
}
.search-box::placeholder { color: var(--text-muted); }
.search-box:focus { outline: none; border-color: var(--gold); }
.table-container { overflow-x: auto; border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  background: var(--bg-panel); padding: 12px 16px; text-align: left;
  color: var(--gold); font-weight: bold; white-space: nowrap;
  border-bottom: 2px solid rgba(242,169,0,0.3); position: sticky; top: 0;
}
td { padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
tr:hover { background: rgba(242,169,0,0.05); }
.char-cell { font-weight: bold; white-space: nowrap; }
.char-swk { color: var(--gold); }
.char-zbj { color: var(--green); }
.char-ss { color: var(--blue); }
.char-blm { color: var(--purple); }
.char-tsz { color: var(--red); }
.char-gen { color: var(--text-muted); }
.rarity-basic { color: #aaa; }
.rarity-common { color: #b0b0b0; }
.rarity-uncommon { color: var(--blue); }
.rarity-rare { color: var(--gold); }
.rarity-legendary { color: var(--legendary); font-weight: bold; }
.rarity-curse { color: var(--red); }
.type-attack { color: #ff7043; }
.type-skill { color: var(--blue); }
.type-defense { color: var(--green); }
.type-power { color: var(--purple); }
.type-status { color: var(--text-muted); }
.tier-common { color: #b0b0b0; }
.tier-uncommon { color: var(--blue); }
.tier-rare { color: var(--gold); }
.tier-boss { color: var(--legendary); font-weight: bold; }
.tier-special { color: #e040fb; }
.section-header {
  margin-top: 24px; margin-bottom: 8px; font-size: 18px; color: var(--gold);
  border-left: 4px solid var(--gold); padding-left: 12px;
}
.cost-cell { text-align: center; font-weight: bold; }
.cost-0 { color: var(--green); }
.cost-1 { color: #aaa; }
.cost-2 { color: var(--blue); }
.cost-3 { color: var(--red); }
.hidden { display: none; }
.content-section { display: none; }
.content-section.active { display: block; }
.emoji-cell { font-size: 20px; text-align: center; }
</style>
</head>

<p class="subtitle">卡牌总数 200 张 · 宝物总数 60 个</p>

<!-- ====== 卡牌总览 ====== -->
<div id="cards-section" class="content-section active">

    <button class="filter-btn" data-filter="沙僧" onclick="filterCards('沙僧')" style="border-color:rgba(79,195,247,0.3)">🟤 沙僧</button>

    <button class="filter-btn" data-filter="通用" onclick="filterCards('通用')">⚔️ 通用</button>
  </div>
  <input type="text" class="search-box" id="cardSearch" placeholder="搜索卡牌名称或效果..." oninput="searchCards()">
  <div class="table-container">
    <table id="cardTable">
      <thead>
        <tr>

          <th>卡牌名称</th>
          <th>稀有度</th>
          <th>类型</th>

          <th>卡牌效果</th>

</div>

<!-- ====== 宝物总览 ====== -->

// ====== 渲染逻辑 ======
const charClassMap = {'孙悟空':'char-swk','猪八戒':'char-zbj','沙僧':'char-ss','白龙马':'char-blm','唐三藏':'char-tsz','通用':'char-gen'};
const rarityLabels = {BASIC:'基础',COMMON:'普通',UNCOMMON:'罕见',RARE:'稀有',LEGENDARY:'传说',CURSE:'诅咒'};
const typeLabels = {ATTACK:'攻击',SKILL:'技能',DEFENSE:'防御',POWER:'能力',STATUS:'状态'};
const tierLabels = {COMMON:'普通',UNCOMMON:'罕见',RARE:'稀有',BOSS:'首领',SPECIAL:'专属'};
let currentCardFilter = 'all';
let currentRelicFilter = 'all';

function renderCards() {
  const tbody = document.getElementById('cardBody');
  const search = document.getElementById('cardSearch').value.toLowerCase();
  tbody.innerHTML = '';
  cards.forEach(card => {
    if (currentCardFilter !== 'all' && card.c !== currentCardFilter) return;
    if (search && !card.n.toLowerCase().includes(search) && !card.e.toLowerCase().includes(search)) return;
    const tr = document.createElement('tr');
    const costClass = 'cost-' + Math.min(card.cost, 3);
    tr.innerHTML = `
      <td class="char-cell ${charClassMap[card.c]}">${card.c}</td>
      <td><strong>${card.n}</strong></td>
      <td class="rarity-${card.r.toLowerCase()}">${rarityLabels[card.r]||card.r}</td>
      <td class="type-${card.t.toLowerCase()}">${typeLabels[card.t]||card.t}</td>
      <td class="cost-cell ${costClass}">${card.cost}</td>
      <td>${card.e}</td>
    `;
    tbody.appendChild(tr);
  });
}

function renderRelics() {
  const tbody = document.getElementById('relicBody');
  const search = document.getElementById('relicSearch').value.toLowerCase();
  tbody.innerHTML = '';
  relics.forEach(relic => {
    if (currentRelicFilter !== 'all' && relic.c !== currentRelicFilter) return;
    if (search && !relic.n.toLowerCase().includes(search) && !relic.e.toLowerCase().includes(search)) return;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="char-cell ${charClassMap[relic.c]}">${relic.c}</td>
      <td><strong>${relic.n}</strong></td>
      <td class="tier-${relic.tier.toLowerCase()}">${tierLabels[relic.tier]||relic.tier}</td>
      <td>${relic.e}</td>
    `;
    tbody.appendChild(tr);
  });
}

function filterCards(f) {
  currentCardFilter = f;
  document.querySelectorAll('#cards-section .filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`#cards-section .filter-btn[data-filter="${f}"]`).classList.add('active');
  renderCards();
}

function filterRelics(f) {
  currentRelicFilter = f;
  document.querySelectorAll('#relics-section .filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`#relics-section .filter-btn[data-filter="${f}"]`).classList.add('active');
  renderRelics();
}

function searchCards() { renderCards(); }
function searchRelics() { renderRelics(); }

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
  if (tab === 'cards') {
    document.querySelector('.tab-btn').classList.add('active');
    document.getElementById('cards-section').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('relics-section').classList.add('active');
  }
}

// 初始渲染
renderCards();
renderRelics();
</script>
